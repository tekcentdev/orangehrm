name: Deploy

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'dev/**'
      - 'feature/**'

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------
      # Determine environment
      # -------------------
      - name: Determine environment
        id: env
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" =~ ^dev/.* || "$BRANCH" =~ ^feature/.* || "$BRANCH" =~ .*codex.* ]]; then
            echo "deploy_path=/var/www/html/orangehrm/test" >> $GITHUB_OUTPUT
            echo "env_prefix=test" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "main" || "$BRANCH" =~ ^release/.* ]]; then
            echo "deploy_path=/var/www/html/orangehrm/prod" >> $GITHUB_OUTPUT
            echo "env_prefix=prod" >> $GITHUB_OUTPUT
          else
            echo "❌ Branch is not allowed to deploy"
            exit 1
          fi

      # -------------------
      # Generate version.txt
      # -------------------
      - name: Generate version info
        run: |
          echo "Branch: $GITHUB_REF_NAME" > version.txt
          echo "Build: $GITHUB_RUN_NUMBER" >> version.txt
          echo "Built at: $(date '+%Y-%m-%d %H:%M:%S')" >> version.txt

      # -------------------
      # Deploy via SSH
      # -------------------
      - name: Deploy to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          DEPLOY_PATH="${{ steps.env.outputs.deploy_path }}"
          SHARED_PATH="$DEPLOY_PATH/shared"

          echo "$SSH_KEY" > deploy.key
          chmod 600 deploy.key

          ssh -i deploy.key -o StrictHostKeyChecking=no \
            $DEPLOY_USER@$DEPLOY_HOST \
            "mkdir -p $SHARED_PATH"

          rsync -avz \
            --exclude='.git' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='.github' \
            -e "ssh -i deploy.key -o StrictHostKeyChecking=no" \
            ./ \
            $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH
``